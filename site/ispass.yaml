# ---------------------------------------------------------------------------
# The evergreen ISPASS layer.
#
# Everything here outlives any single conference. It powers the permanent
# landing page at /, the Previous Symposia page, and the steering committee and
# policy pages.
#
# When a new year's site goes live, the ONLY change needed here is
# `current_year`, plus moving the outgoing year into `past_conferences`.
# ---------------------------------------------------------------------------

name: "ISPASS"
full_name: "IEEE International Symposium on Performance Analysis of Systems and Software"

description: >-
  ISPASS, the IEEE International Symposium on Performance Analysis of Systems
  and Software, is the leading annual forum for research on the measurement,
  characterization, modelling and simulation of computer systems and software.

tagline: "Measuring how systems really behave, since 2000."

# Which conference the landing page points at. This is the one line to change
# when the next edition takes over.
current_year: 2027

sponsors_note: >-
  ISPASS is sponsored by the IEEE Computer Society and has been supported by its
  Technical Committee on Computer Architecture (TCCA) and its Technical
  Committee on Microarchitecture (TCuARCH).

# TBD: the ISPASS Steering Committee membership has not been confirmed for this
# site. Add entries as { name, affiliation, url } once verified with the
# Steering Committee chair. Do not copy names from an old conference page.
steering_committee: []
steering_committee_note: >-
  The ISPASS Steering Committee oversees the symposium across years and appoints
  each edition's General Chair. Its current membership has not yet been
  confirmed for publication on this site.

policies:
  - title: "IEEE Event Conduct and Safety Statement"
    url: "https://events.ieee.org/planning-basics/general-guidelines/ieee-event-conduct-and-safety-statement-for-conferences/"
    description: >-
      A safe, productive and welcoming environment at every IEEE event, with no
      tolerance for discrimination, harassment or bullying. Concerns can be
      reported to eventconduct@ieee.org.
  - title: "IEEE Computer Society Open Conference Statement"
    url: "/files/ieee-cs-open-conference-statement.pdf"
    description: >-
      The Computer Society's commitment to broad participation in all of its
      activities, free of discrimination and harassment.
  - title: "IEEE Intellectual Property Rights"
    url: "https://www.ieee.org/publications/rights"
    description: >-
      Copyright, author rights and permissions for papers published by IEEE.

