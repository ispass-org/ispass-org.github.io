# ---------------------------------------------------------------------------
# The ONE canonical list of important dates.
#
# No deadline may be written anywhere else — not in Markdown, not in a page
# template. Pages and the .ics feed read this file. `npm run validate` fails if
# a date is malformed or an id is duplicated.
#
# Fields:
#   id        stable slug, referenced by pages and by src/lib/phase.ts
#   name      what the visitor sees
#   date      YYYY-MM-DD, or null while unannounced
#   time      HH:MM, 24-hour, or null for an all-day deadline
#   end_date  set for ranges (rebuttal period, the conference itself)
#   timezone  IANA name, or the special value AoE (Anywhere on Earth)
#   category  groups the row; see docs/content-model.md
#   note      short clarification shown under the date
#   extended  true if the deadline was pushed back — say so, don't hide it
#   hidden    true to keep a row out of the public site without deleting it
# ---------------------------------------------------------------------------

