# ---------------------------------------------------------------------------
# ISPASS 2027 technical program — EMPTY PLACEHOLDER SKELETON.
#
# The days match conference.yaml (9-11 May 2027). Every day has the same
# neutral shape on purpose: it does not say how many keynotes there will be,
# or on which day workshops and tutorials take place, because neither is
# decided. Times are provisional; `draft: true` renders a "Provisional" notice.
#
# To fill it in once decided:
#   - replace "Sessions to be announced" slots with real sessions: keynotes
#     (kind: keynote), paper sessions (kind: papers, with a topic, chair, room
#     and papers list), workshops and tutorials (kind: workshop / tutorial)
#   - add the opening, poster session, banquet and closing where they belong
#   - adjust times, then set `draft: false` once the schedule is final
#
# Structure:
#   days[]            one per conference day
#     date            YYYY-MM-DD
#     label           e.g. "Main Conference"; defaults to the weekday
#     slots[]         one row of the schedule, in time order
#       start/end     HH:MM local time (program.timezone)
#       sessions[]    one entry = one track. Two or more entries in the same
#                     slot render side by side as parallel tracks.
#         id          unique slug; becomes the #anchor
#         kind        papers | keynote | break | social | poster | workshop |
#                     tutorial | admin
#         papers[]    title, authors[], award, badges[], recorded
# ---------------------------------------------------------------------------

sample: false
draft: true
timezone: "America/New_York"
note: "Placeholder schedule. Keynotes, workshops, tutorials and paper sessions will be announced."

legend:
  - symbol: "★"
    meaning: "Best paper nominee"
  - symbol: "◆"
    meaning: "Artifact evaluated"

