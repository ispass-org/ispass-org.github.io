# ---------------------------------------------------------------------------
# ISPASS 2027 technical program.
#
#  >>> EVERYTHING BELOW IS SAMPLE CONTENT. <<<
#
# `sample: true` makes the Program page render an unmissable banner, and
# `npm run validate` refuses to build once the conference phase reaches
# `program_published` while this flag is still set. Replace the days below with
# the real schedule and set `sample: false`.
#
# Structure:
#   days[]            one per conference day
#     date            YYYY-MM-DD
#     label           e.g. "Workshops & Tutorials"; defaults to the weekday
#     slots[]         one row of the schedule, in time order
#       start/end     HH:MM local time (program.timezone)
#       sessions[]    one entry = one track. Two or more entries in the same
#                     slot render side by side as parallel tracks.
#         kind        papers | keynote | break | social | poster | workshop |
#                     tutorial | admin
#         papers[]    title, authors[], award, badges[], recorded
#
# Author names are written as free text exactly as they should appear, e.g.
# "Jane Example (Example University)".
# ---------------------------------------------------------------------------

sample: true
draft: true
timezone: "America/New_York"
note: null

legend:
  - symbol: "★"
    meaning: "Best paper nominee"
  - symbol: "◆"
    meaning: "Artifact evaluated"

