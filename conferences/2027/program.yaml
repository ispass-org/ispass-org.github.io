# ---------------------------------------------------------------------------
# ISPASS 2027 technical program — EMPTY PLACEHOLDER SKELETON.
#
# The days match conference.yaml (9-11 May 2027). Every slot below is a
# placeholder: no papers, no chairs, no rooms. Times follow the usual ISPASS
# shape and are provisional; `draft: true` renders a "Provisional" notice on
# the Program page.
#
# To fill it in after paper notification:
#   - give each paper session a topic, e.g. "Session 1A: Machine Learning
#     Systems", and add its `chair` and `room`
#   - add the `papers:` list under each paper session
#   - set the keynote `speaker` (and fill keynotes.yaml)
#   - add workshops/tutorials as separate sessions in the day-one slots
#   - adjust times, then set `draft: false` once the schedule is final
#
# Structure:
#   days[]            one per conference day
#     date            YYYY-MM-DD
#     label           e.g. "Workshops & Tutorials"; defaults to the weekday
#     slots[]         one row of the schedule, in time order
#       start/end     HH:MM local time (program.timezone)
#       sessions[]    one entry = one track. Two or more entries in the same
#                     slot render side by side as parallel tracks.
#         id          unique slug; becomes the #anchor
#         kind        papers | keynote | break | social | poster | workshop |
#                     tutorial | admin
#         papers[]    title, authors[], award, badges[], recorded
# ---------------------------------------------------------------------------

sample: false
draft: true
timezone: "America/New_York"
note: "Placeholder schedule. Sessions, papers, rooms and times will be filled in after paper notification."

legend:
  - symbol: "★"
    meaning: "Best paper nominee"
  - symbol: "◆"
    meaning: "Artifact evaluated"

