# Publishes the site to GitHub Pages on every push to main.
#
# The repository must be public: GitHub Pages is not available for private
# repositories on GitHub's free plan, so on a private repo the deploy job fails.
#
# Pointing ispass.org at the published site is a separate, manual step. See
# docs/deployment.md, "Connecting a custom domain".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Malformed content must never reach the live site.
      - run: npm run validate
      - run: npm run check
      - run: npm run build:only
      - run: npm run lint
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
