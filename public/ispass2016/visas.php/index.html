<p>If you require an invitation letter for purposes of a visa application,
please send an email with your name, email address, mailing address, IEEE
member number (if any), the ID of the paper you are presenting (if any) and a
copy of your registration confirmation to Jose Renau, the Program Chair at <a
href="mailto:renau@ucsc.edu?subject=Visa%20for%20ISPASS%20">renau@ucsc.edu</a>.</p>

<p> Please note that we can only issue visa letters to speakers/presenters or
attendees who <!-- have paid their registration fee in full and  are not from one of
the countries embargoed by the U.S. Treasury Department's Office of Foreign
Assets Control. See <a target="_blank"
href="http://www.ieee.org/documents/visa_request_process.pdf"> IEEE visa
request process regulations</a> and the <a target="_blank"
href="http://travel.state.gov/visa/visa_1750.html">U.S.  Department of State
web site</a> for more information.</font></p>
